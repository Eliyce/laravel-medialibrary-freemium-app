# Releases from `production` with changesets/action and npm Trusted Publishing (OIDC). Merging
# `main` into `production` runs this workflow. It reruns CI, then:
# - Pending changesets on `production`: runs `npm run version-packages` and opens or updates the
#   `chore(release): version packages` PR into `production` (branch changeset-release/production)
#   as the owner of the GH_RELEASE_TOKEN PAT, so CI runs on it.
# - No pending changesets (the version PR was merged): runs `npm run release`, which publishes any
#   version not on npm yet through Trusted Publishing, with no npm token and no provenance (the
#   repository is private). The action then creates the `vX.Y.Z` tag (Private Packagist picks it
#   up) and the GitHub release from that version's CHANGELOG.md section.
# A re-run publishes nothing that is already on npm. The version commit lands on `production`
# only, so merge `production` back into `main` by hand after each release. The npm trusted
# publisher names this file: renaming release.yml means changing that setting on npmjs.com too.
name: Release

on:
  push:
    branches: [production]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # ci.yml computes `Release-<ref>` when called from here, so the two groups never block each other.
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    needs: ci
    # Only in the Eliyce repository and only on production. A workflow_dispatch from any other
    # branch reruns CI and stops here, so it never versions or publishes.
    if: github.repository_owner == 'Eliyce' && github.ref == 'refs/heads/production'
    runs-on: ubuntu-latest
    permissions:
      # The version commit and branch, the vX.Y.Z tag and the GitHub release.
      contents: write
      # Open or update the version PR.
      pull-requests: write
      # npm Trusted Publishing exchanges the OIDC token for a short-lived publish credential.
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # The action pushes with its github-token input, so no token is left in .git/config.
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          # No dependency cache in a release build.
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      # Trusted Publishing needs npm >= 11.5.1. npm 12 is excluded until it is verified.
      - name: Install npm for Trusted Publishing
        run: npm install -g "npm@>=11.5.1 <12"

      # v2 because @changesets/cli is v3: the v1 action cannot read the CLI 3 publish output.
      - uses: changesets/action@v2
        with:
          # A PAT, not GITHUB_TOKEN: a PR or push made with GITHUB_TOKEN does not trigger CI.
          github-token: ${{ secrets.GH_RELEASE_TOKEN }}
          version-script: npm run version-packages
          publish-script: npm run release
          commit-message: 'chore(release): version packages'
          pr-title: 'chore(release): version packages'
