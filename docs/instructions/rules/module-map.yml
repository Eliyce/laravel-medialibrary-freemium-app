domain_glossary:
  preferred_terms:
    - media-pro
    - public API
    - temporary upload
    - media uuid
    - collection
    - attachment
    - value item
    - media value
    - media object
    - custom property
  synonyms:
    entry point: public API
    export: public API
    subpath export: public API
    temp upload: temporary upload
    pending upload: temporary upload
    uuid: media uuid
    form value: media value
    media item: value item
  definitions:
    temporary upload: >-
      A file stored by POST /{prefix}/uploads or /{prefix}/s3 before its form is submitted. It is a
      `TemporaryUpload` row (table `temporary_uploads`) owning one Spatie media row, scoped to the
      session id that created it, and removed by `media-pro:delete-old-temporary-uploads`.
    media uuid: >-
      The uuid that identifies one media item end to end. The browser generates it
      (`generateUuid`) before uploading, the server stores it on the media row and keeps it when
      the item moves from a temporary upload into a model collection. Unique in the media table.
    collection: >-
      A Spatie media collection on a model (`toMediaCollection('images')`), and the React
      `MediaLibraryCollection` component that edits a sortable list of items for one.
    attachment: >-
      The React `MediaLibraryAttachment` component: one file by default (a new file replaces it),
      several with `multiple`.
    value item: >-
      One entry of the media value: `{ uuid, name, order, custom_properties, file_name?,
      preview_url?, original_url?, size?, mime_type?, extension? }` (`ValueItem` in TypeScript,
      `MediaLibraryRequestItem` in PHP).
    media value: >-
      What a component submits under its `name`: value items keyed by media uuid, in display
      order, with a zero-based `order` (`MediaValue`).
    media object: >-
      One entry of the core state (`MediaObject`): the value item as `attributes` plus upload
      progress, client errors, an optional object-URL preview and a stable `client_id`.
    custom property: >-
      A free key/value on a value item (`custom_properties`). The server saves only keys listed
      in `withCustomProperties()`; `__proto__`, `constructor` and `prototype` are always dropped
      on the client.
  notes: >-
    Terms follow Spatie Media Library Pro v6 and the exported symbol names. "Media" alone means a
    Spatie media row; say "temporary upload" for the pre-submit file and "media object" for the
    client state entry.
